
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | StudentHub</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body style="min-height:100vh;background:linear-gradient(135deg,#101c3a,#263f70);">

<div class="container d-flex justify-content-center align-items-center"
     style="min-height:100vh;">

    <div class="bg-white rounded-4 shadow-lg p-4 p-md-5"
         style="width:100%;max-width:430px;">

        <div class="text-center mb-4">

            <div class="brand-icon mx-auto mb-3"
                 style="width:65px;height:65px;font-size:28px;">
                <i class="fas fa-graduation-cap"></i>
            </div>

            <h3 class="fw-bold" style="color:#101c3a;">
                STUDENT<span style="color:#35c6b0;">HUB</span>
            </h3>

            <p class="text-muted small">
                Student Management Portal
            </p>

        </div>

        <div class="mb-4">
            <h5 class="fw-bold">Welcome Back!</h5>
            <p class="text-muted small">
                Please sign in to access your dashboard.
            </p>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-danger small">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label">Username</label>

                <div class="input-group">
                    <span class="input-group-text bg-white">
                        <i class="fas fa-user text-muted"></i>
                    </span>

                    <input type="text"
                           name="username"
                           class="form-control"
                           placeholder="Enter your username"
                           required>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label">Password</label>

                <div class="input-group">
                    <span class="input-group-text bg-white">
                        <i class="fas fa-lock text-muted"></i>
                    </span>

                    <input type="password"
                           name="password"
                           class="form-control"
                           placeholder="Enter your password"
                           required>
                </div>
            </div>

            <button type="submit"
                    class="btn btn-primary w-100 py-3 fw-semibold"
                    style="border-radius:9px;">
                Sign In <i class="fas fa-arrow-right ms-2"></i>
            </button>

        </form>

        <div class="text-center mt-4">
            <small class="text-muted">
                © 2026 StudentHub. All rights reserved.
            </small>
        </div>

    </div>

</div>

</body>
</html>
